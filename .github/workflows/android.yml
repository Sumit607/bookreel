name: Android build and test

# Builds and tests the APK when the Android shell changes, or by hand from the Actions tab. The app opens
# bookreel-sand.vercel.app, so books and web app changes reach phones without a new APK (see MainActivity).
# Each green run publishes a Release; bookreel-sand.vercel.app/apk always points at the newest one.
on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - "tools/e2e.py"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      GRADLE_OPTS: -Dorg.gradle.daemon=false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        id: unit
        continue-on-error: true
        working-directory: android
        run: |
          set -o pipefail
          mkdir -p ../out
          ./gradlew testDebugUnitTest --stacktrace 2>&1 | tee ../out/unit-tests.log

      - name: Build release APK (R8 optimized)
        working-directory: android
        run: |
          set -o pipefail
          ./gradlew assembleRelease --stacktrace 2>&1 | tee ../out/build.log
          ls -l app/build/outputs/apk/release/

      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test helpers
        run: python -m pip install --quiet pillow websocket-client

      - name: End-to-end test on an Android 15 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 4096M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot
          script: python3 tools/e2e.py android/app/build/outputs/apk/release/app-release.apk out

      - name: Publish results to the ci-results branch
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p results
          cp -r out/. results/ 2>/dev/null || true
          cp android/app/build/outputs/apk/release/app-release.apk results/bookreel.apk 2>/dev/null || true
          cp -r android/app/build/reports/tests results/unit-test-report 2>/dev/null || true
          cp -r android/app/build/test-results results/unit-test-xml 2>/dev/null || true
          echo "run=${GITHUB_RUN_NUMBER} sha=${GITHUB_SHA} status=${{ job.status }}" > results/RUN.txt
          # Tell Vercel not to try deploying this results-only branch.
          mkdir -p results/web && printf '{"git":{"deploymentEnabled":false}}\n' > results/web/vercel.json
          cd results
          git init -q
          git checkout -q -b ci-results
          git config user.name "bookreel-ci"
          git config user.email "ci@users.noreply.github.com"
          git add -A
          git commit -qm "CI results for run ${GITHUB_RUN_NUMBER}"
          git push -qf "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ci-results

      - name: Fail the run if unit or content tests failed
        if: steps.unit.outcome == 'failure'
        run: |
          echo "Unit tests failed; see out/unit-tests.log on the ci-results branch"
          exit 1

      - name: Attach the APK to a GitHub Release
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v1.0.${GITHUB_RUN_NUMBER}"
          cp android/app/build/outputs/apk/release/app-release.apk "bookreel-${TAG}.apk"
          cp android/app/build/outputs/apk/release/app-release.apk bookreel.apk
          gh release create "$TAG" "bookreel-${TAG}.apk" bookreel.apk \
            --title "Bookreel ${TAG}" \
            --notes "Tested build from CI run ${GITHUB_RUN_NUMBER}. Install on Android 8.0 or newer. The app opens bookreel-sand.vercel.app, so new books and app changes arrive without reinstalling." \
            --latest
