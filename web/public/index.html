<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Bookreel</title>
  <meta name="description" content="Books as a feed: every book in 20 chapters of 10 swipeable posts.">
  <meta name="theme-color" content="#111418">
  <meta name="color-scheme" content="light dark">
  <meta name="robots" content="noindex">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icons/favicon-48.png" sizes="48x48">
  <link rel="apple-touch-icon" href="/icons/apple-180.png">
  <link rel="preload" href="/fonts/display_black.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/fonts/literata_regular.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/fonts/plexmono_medium.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/app.css">
  <link rel="modulepreload" href="/js/app.js">
</head>
<body>
  <div id="app" aria-live="polite"></div>
  <div id="sheet" hidden></div>
  <div id="toast" role="status" hidden></div>
  <noscript><p style="padding:24px;font-family:system-ui">Bookreel needs JavaScript to run.</p></noscript>
  <script type="module" src="/js/app.js"></script>
</body>
</html>
